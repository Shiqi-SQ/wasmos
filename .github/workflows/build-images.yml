name: 构建 ext2 磁盘镜像

# 手动触发。构建一次很慢（要拉 i386 基础镜像 + 装包 + 造文件系统），
# 且产物是 GB 级的，不适合每次 push 都跑。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 要构建的展位（对应 dockerfiles/ 下的文件名）
        required: true
        type: choice
        options: [alpine-desktop, debian-12, ubuntu-1804, centos-7, all]
        default: alpine-desktop

permissions:
  contents: read

jobs:
  # 先算出要构建的目标，让矩阵只起需要的 runner。
  # 之前矩阵固定跑全部、靠 step 里 if 跳过，会白起 runner，
  # 且被跳过的项也报 success，看不出实际构建了什么。
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - id: set
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "all" ]; then
            echo 'targets=["alpine-desktop","debian-12","ubuntu-1804","centos-7"]' >> "$GITHUB_OUTPUT"
          else
            echo "targets=[\"$TARGET\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: |
          sudo apt-get update
          # buildah/podman 用来构建和展开容器；e2fsprogs 提供 mkfs.ext2
          sudo apt-get install -y buildah podman e2fsprogs
          # 让 x86_64 的 runner 能跑 i386 镜像
          sudo apt-get install -y qemu-user-static binfmt-support || true

      - name: 构建容器镜像
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # --platform 与 --arch 互斥，只能用其一
          buildah build --platform linux/386 \
            -f "dockerfiles/$TARGET" -t "wasmos-$TARGET" .

      - name: 导出为 ext2
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # 每个目标给不同容量。实测 1500M 的 Debian 镜像里只有 503MB
          # 是真实数据，其余是空块 —— 白占存储和上传时间。
          # 留出约 2 倍余量供用户 apt install。
          case "$TARGET" in
            alpine-desktop) SIZE=600M  ;;
            debian-12)      SIZE=900M  ;;
            ubuntu-1804)    SIZE=900M  ;;
            centos-7)       SIZE=900M  ;;
            *)              SIZE=1000M ;;
          esac
          echo "目标容量 $SIZE"
          # podman unshare 让操作以容器内 root 身份进行，避免文件属主错乱
          podman unshare bash -euo pipefail -c '
            CT=$(buildah from "wasmos-$1")
            MNT=$(buildah mount "$CT")
            echo "容器根目录挂在 $MNT"
            # mkfs.ext2 -d 直接把一个目录塞进新建的文件系统
            mkfs.ext2 -L wasmos -b 4096 -d "$MNT" "$1.ext2" "$2"
            buildah umount "$CT"
            buildah rm "$CT"
          ' _ "$TARGET" "$SIZE"
          ls -lh "$TARGET.ext2"
          # 报告实际占用，便于下次调整容量
          dumpe2fs -h "$TARGET.ext2" 2>/dev/null | grep -E "Block count|Free blocks|Block size" || true
          # CheerpX 上限 2GB，超了直接失败而不是等运行时才发现
          if [ "$(stat -c%s "$TARGET.ext2")" -gt 2147483648 ]; then
            echo "::error::镜像超过 CheerpX 的 2GB 上限"
            exit 1
          fi

      - name: 上传到 COS
        env:
          TARGET: ${{ matrix.target }}
          SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          BUCKET: ${{ secrets.COS_BUCKET }}
          REGION: ${{ secrets.COS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_ID:-}" ]; then
            echo "::error::未配置 COS_SECRET_ID 等 Secrets，跳过上传"
            exit 1
          fi
          pip install --quiet coscmd
          coscmd config -a "$SECRET_ID" -s "$SECRET_KEY" -b "$BUCKET" -r "$REGION"
          # 放 COS 而非 GitHub Releases —— 后者不发 CORS 头，浏览器拿不到。
          # COS 需要在控制台配好跨域规则，且 Expose-Headers 必须包含
          # Content-Length 和 Content-Range，否则 CheerpX 读不到磁盘大小。
          coscmd upload "$TARGET.ext2" "wasmos/$TARGET.ext2"
          echo "已上传 → https://sh-p1.furryfans.cn/wasmos/$TARGET.ext2"
