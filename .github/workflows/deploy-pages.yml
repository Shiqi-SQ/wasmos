name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # public/ 就是站点根目录，没有构建步骤 —— 纯静态、无依赖。
      # COOP/COEP 由 public/coi-serviceworker.js 在客户端注入，
      # 因为 GitHub Pages 不允许自定义响应头。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
