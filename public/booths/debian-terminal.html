<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Debian 终端 — wasmos</title>
<style>
  body { margin:0; background:#000; color:#ccc;
         font:13px/1.35 ui-monospace, Menlo, monospace; }
  #console { padding:8px; white-space:pre-wrap; word-break:break-all; outline:none; }
  #hint { position:fixed; top:8px; right:12px; color:#666; font-size:11px; }
</style>
</head>
<body>
<div id="hint">加载中…</div>
<pre id="console" tabindex="0"></pre>
<script type="module">
import * as CheerpX from 'https://cxrtnc.leaningtech.com/1.2.8/cx.esm.js';

const $hint = document.getElementById('hint');
const $console = document.getElementById('console');

if (!crossOriginIsolated) {
  $hint.textContent = '缺 COOP/COEP —— 用 npm run dev 启动';
} else {
  // WebVM 官方的 Debian 镜像，配套 /bin/bash --login。
  // 这是 CheerpX 文档里的第一个例子，最稳的路径。
  const cloud = await CheerpX.CloudDevice.create(
    'wss://disks.webvm.io/debian_large_20230522_5044875331.ext2');
  const idb = await CheerpX.IDBDevice.create('wasmos-debian');
  const overlay = await CheerpX.OverlayDevice.create(cloud, idb);

  const cx = await CheerpX.Linux.create({
    mounts: [
      { type: 'ext2', path: '/', dev: overlay },
      { type: 'devs', path: '/dev' },
      { type: 'devpts', path: '/dev/pts' },
      { type: 'proc', path: '/proc' },
      { type: 'sys', path: '/sys' },
    ],
  });

  // setConsole 直接把 guest 的 tty 接到这个 <pre>，键盘输入也由它接管
  cx.setConsole($console);
  $hint.textContent = '点击画面后可输入';
  $console.focus();

  // 退出后重启，避免误按 exit 就死掉
  for (;;) {
    await cx.run('/bin/bash', ['--login'], {
      env: ['HOME=/home/user', 'USER=user', 'SHELL=/bin/bash',
            'TERM=xterm', 'LANG=en_US.UTF-8', 'LC_ALL=C',
            'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'],
      cwd: '/home/user', uid: 1000, gid: 1000,
    });
  }
}
</script>
</body>
</html>
